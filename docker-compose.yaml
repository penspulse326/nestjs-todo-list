services:
  postgres:
    image: postgres:17-alpine
    container_name: todo-list-db
    environment:
      POSTGRES_USER: nestjsuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: todo_list_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
